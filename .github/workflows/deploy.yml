name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap signal first: typecheck + Vitest + static export build. No
  # paths-ignore so md/pen-only changes still get insurance against a stale
  # typecheck baseline. Build runs here (not just in build-marketing) so PRs
  # catch `output: "export"` breakage before merge instead of after.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm -w @wardrobe-assistants/marketing run build

  # Static marketing build + upload to bunny Storage Zone, then purge the
  # Pull Zone. Skipped for md/pen-only changes via paths-ignore.
  build-marketing:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Detect non-doc changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!**/*.pen'
              - '!kb/**'
              - '!.claude/**'
              - '!.hyalo.toml'

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci

      - name: Build marketing static export
        if: steps.changes.outputs.app == 'true'
        run: npm -w @wardrobe-assistants/marketing run build

      - name: Upload to bunny Storage Zone and purge Pull Zone
        if: steps.changes.outputs.app == 'true'
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.5
        with:
          source: "apps/marketing/out"
          destination: "/"
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          storagePassword: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          upload: "true"
          remove: "true"
          purgePullZone: "true"
