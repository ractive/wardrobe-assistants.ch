name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap signal first: typecheck + Vitest + both Next builds. No
  # paths-ignore so md/pen-only changes still get insurance against a stale
  # typecheck baseline. Builds run here (not just in build-*) so PRs catch
  # breakage before merge instead of after.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm -w @wardrobe-assistants/homepage run build
      # Admin build needs env vars to satisfy lib/env.ts at build time.
      # Values here are placeholders only; runtime uses container env.
      - name: Build admin standalone
        env:
          DATABASE_URL: file:./build.db
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime-32b
          BETTER_AUTH_URL: https://admin.wardrobe-assistants.ch
          RESEND_API_KEY: ci-placeholder
          EMAIL_FROM: admin@wardrobe-assistants.ch
        run: npm -w @wardrobe-assistants/admin run build

  # Static homepage build + upload to bunny Storage Zone, then purge the
  # Pull Zone. Skipped for md/pen-only changes via paths-filter.
  build-homepage:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Detect non-doc changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!**/*.pen'
              - '!kb/**'
              - '!.claude/**'
              - '!.hyalo.toml'

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci

      - name: Build homepage static export
        if: steps.changes.outputs.app == 'true'
        run: npm -w @wardrobe-assistants/homepage run build

      - name: Upload to bunny Storage Zone and purge Pull Zone
        if: steps.changes.outputs.app == 'true'
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.5
        with:
          source: "apps/homepage/out"
          destination: "/"
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          storagePassword: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          upload: "true"
          remove: "true"
          purgePullZone: "true"

  # Admin Docker build/push/roll. Skipped for md/pen-only changes via
  # paths-filter — note the leading '**' positive pattern: paths-filter
  # treats negation-only filters as never matching.
  build-admin:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect non-doc changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!**/*.pen'
              - '!kb/**'
              - '!.claude/**'
              - '!.hyalo.toml'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to bunny.net container registry
        if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.BUNNY_REGISTRY }}
          username: ${{ secrets.BUNNY_REGISTRY_USERNAME }}
          password: ${{ secrets.BUNNY_REGISTRY_PASSWORD }}

      - name: Build and push admin image
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ secrets.BUNNY_REGISTRY }}/${{ vars.ADMIN_APP_ID }}:${{ github.sha }},${{ secrets.BUNNY_REGISTRY }}/${{ vars.ADMIN_APP_ID }}:latest

      - name: Roll Magic Container deployment
        if: steps.changes.outputs.app == 'true'
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          ADMIN_APP_ID: ${{ vars.ADMIN_APP_ID }}
        run: |
          curl -fsS -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/magic-containers/apps/$ADMIN_APP_ID/deploy"
