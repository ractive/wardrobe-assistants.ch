name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  # Disable Next.js anonymous telemetry across all jobs (build-homepage runs
  # `next build` directly on the runner; admin's Dockerfile sets this too so
  # buildx and the distroless runtime stay quiet).
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Cheap signal first: typecheck + Vitest + both Next builds. No
  # paths-ignore so md/pen-only changes still get insurance against a stale
  # typecheck baseline. Builds run here (not just in build-*) so PRs catch
  # breakage before merge instead of after.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # iter-16b (audit C-CI-01): mirror the local pre-commit gate so Biome's
      # `noRestrictedImports` overrides (cross-feature isolation) actually
      # fire on PRs — they were on the honor system when CI only ran
      # typecheck + test.
      - run: npm run verify
      - run: npm -w @wardrobe-assistants/homepage run build
      # Admin build needs env vars to satisfy lib/env.ts at build time.
      # Values are shape-valid placeholders only (NODE_ENV=production during
      # `next build` triggers iter-13's prod tripwires: remote-shape DATABASE_URL,
      # 64-hex BETTER_AUTH_SECRET, RESEND_API_KEY present). Runtime uses
      # container env — these never reach a request.
      - name: Build admin standalone
        env:
          DATABASE_URL: libsql://ci-placeholder.invalid
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: https://admin.wardrobe-assistants.ch
          RESEND_API_KEY: ci-placeholder
          EMAIL_FROM: admin@wardrobe-assistants.ch
        run: npm -w @wardrobe-assistants/admin run build

  # Static homepage build + upload to bunny Storage Zone, then purge the
  # Pull Zone. Skipped for md/pen-only changes via paths-filter.
  build-homepage:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Detect non-doc changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!**/*.pen'
              - '!kb/**'
              - '!.claude/**'
              - '!.hyalo.toml'

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci

      - name: Build homepage static export
        if: steps.changes.outputs.app == 'true'
        run: npm -w @wardrobe-assistants/homepage run build

      - name: Upload to bunny Storage Zone and purge Pull Zone
        if: steps.changes.outputs.app == 'true'
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.5
        with:
          source: "apps/homepage/out"
          destination: "/"
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          storagePassword: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          accessKey: ${{ secrets.BUNNYNET_API_KEY }}
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          upload: "true"
          remove: "true"
          purgePullZone: "true"

  # Admin Docker build/push to ghcr.io + Magic Container roll. Follows
  # bunny.net's canonical pattern (see
  # https://docs.bunny.net/magic-containers/deploy-with-github-actions.md):
  # ghcr.io for image hosting (no extra credentials — GITHUB_TOKEN does it),
  # BunnyWay/actions/container-update-image to roll the container.
  # Gated on vars.APP_ID so the job is skipped before the admin Magic
  # Container app exists.
  build-admin:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect non-doc changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!**/*.pen'
              - '!kb/**'
              - '!.claude/**'
              - '!.hyalo.toml'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          # NEXT_PUBLIC_VAPID_PUBLIC_KEY must be present at `next build` time
          # because Next inlines NEXT_PUBLIC_* into the client bundle.
          # Public half of the VAPID keypair — safe to bake into the image.
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wardrobe-assistants-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/wardrobe-assistants-admin:latest

      # iter-16f / audit C-SEC-12: scan the freshly-pushed image for
      # known CVEs. Fails the deploy on any HIGH/CRITICAL finding so a
      # vulnerable base image can't roll to prod silently.
      # Pinned to a SHA per the iter-16b convention (audit C-SEC-03).
      # SHA: aquasecurity/trivy-action @ 57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      # (tag v0.35.0).
      - name: Scan admin image for vulnerabilities (Trivy)
        if: steps.changes.outputs.app == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/wardrobe-assistants-admin:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # iter-41 §B — extract the freshly-built `_next/static/` tree from the
      # image so we can upload it to the static-asset storage zone. We use
      # `docker create` + `docker cp` (no `docker run`) so we never start the
      # container; the layer is read straight off the filesystem. This keeps
      # the BUILD_ID in lockstep with the image: the HTML rolled into the
      # container references the exact chunks we're about to upload.
      - name: Extract _next/static/ from admin image
        if: steps.changes.outputs.app == 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/wardrobe-assistants-admin:${{ github.sha }}"
          cid=$(docker create "$image")
          # Standalone build copies static to apps/admin/.next/static; the
          # Dockerfile mirrors that exact path on the runtime layer.
          mkdir -p ./admin-static/_next/static
          docker cp "$cid:/app/apps/admin/.next/static/." ./admin-static/_next/static/
          docker rm "$cid" >/dev/null
          ls -lah ./admin-static/_next/static | head -20

      # iter-41 §B — upload to the admin static-asset storage zone BEFORE the
      # container roll. Additive: never delete, so old container instances
      # can still resolve their chunk URLs during a rolling deploy. No
      # pull-zone purge: chunks are content-hashed and `immutable`-cached, so
      # there's nothing to invalidate.
      #
      # Implemented as a curl loop rather than `ayeressian/bunnycdn-storage-deploy`
      # because that action does not await its parallel uploads correctly with
      # Node 24's undici (it fires the entire fileset in one tick and then
      # retry-storms with "expected non-null body source"). The bunny Storage
      # API is trivial — PUT with an AccessKey header — so we run curl directly
      # with bounded parallelism (xargs -P 8). Halt-on-error via exit 255.
      - name: Upload _next/static/ to bunny storage zone
        if: steps.changes.outputs.app == 'true'
        env:
          STORAGE_ZONE: ${{ secrets.BUNNY_ADMIN_STATIC_STORAGE_ZONE_NAME }}
          STORAGE_KEY: ${{ secrets.BUNNY_ADMIN_STATIC_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail
          cd admin-static
          total=$(find . -type f | wc -l | tr -d ' ')
          echo "Uploading $total files to bunny storage zone..."
          # --globoff: webpack chunk filenames contain `[param]` and `(group)`
          # from App Router route groups, which curl otherwise interprets as
          # URL globbing ranges and rejects with "bad range in URL position N".
          # Turbopack chunk filenames are URL-safe (`~ . _ -` only) and don't
          # need this, but keeping it on costs nothing.
          find . -type f -print0 \
            | xargs -0 -P 8 -n 1 sh -c '
              rel="${1#./}"
              if curl --globoff -fsS -X PUT \
                -H "AccessKey: $STORAGE_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$1" \
                "https://storage.bunnycdn.com/$STORAGE_ZONE/$rel" > /dev/null; then
                printf "  OK  %s\n" "$rel"
              else
                printf "FAIL  %s\n" "$rel" >&2
                exit 255
              fi
            ' _
          echo "Uploaded $total files."

      - name: Roll admin Magic Container to new image
        if: steps.changes.outputs.app == 'true'
        # iter-16b supply-chain hardening (audit C-SEC-03): third-party Action
        # pinned to a commit SHA so a compromised upstream `main` can't take
        # over the deploy. Resolve the new SHA when bumping; document the
        # version in the trailing comment.
        # SHA: BunnyWay/actions @ d15f94f8fd513950561a5996a40f99d1dd1c357c
        # (refs/heads/main as of 2026-05-09).
        uses: BunnyWay/actions/container-update-image@d15f94f8fd513950561a5996a40f99d1dd1c357c
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: wardrobe-assistants-admin
          image_tag: ${{ github.sha }}
