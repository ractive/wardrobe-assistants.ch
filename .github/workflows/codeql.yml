# iter-16f / audit C-SEC-12: weekly CodeQL scan for JavaScript/TypeScript.
#
# Why weekly (not per-PR):
#   - The verify workflow already runs lint/typecheck/test on every PR;
#     that's the fast feedback loop.
#   - CodeQL is multi-minute and exists to catch slow-rotting issues
#     (new query packs, freshly-disclosed sinks) — a weekly cadence is
#     the right cost/coverage trade-off for a small admin app.
#   - SARIF results land in the repo Security tab regardless of where
#     they were produced, so a per-PR run buys little.

name: CodeQL

on:
  schedule:
    # Mondays at 06:00 UTC — early enough that any findings land before
    # the team's first review pass of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default + `security-extended` covers the GitHub-curated query
          # set we're after; no custom packs needed for an app this size.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
